<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BOSS 求职助手 设置页</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f7fb;
        --surface: #ffffff;
        --surface-alt: #eef3f8;
        --ink: #0f172a;
        --muted: #5b6472;
        --border: #dce3ec;
        --accent: #0f766e;
        --accent-strong: #115e59;
        --shadow: 0 14px 30px rgba(15, 23, 42, 0.06);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        background:
          radial-gradient(circle at top right, rgba(15, 118, 110, 0.08), transparent 28%),
          linear-gradient(180deg, #fbfcfe 0%, var(--bg) 100%);
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
      }

      .viewport {
        width: 980px;
        margin: 0 auto;
        padding: 16px;
      }

      .page {
        border: 1px solid var(--border);
        border-radius: 26px;
        background: rgba(255,255,255,0.98);
        box-shadow: var(--shadow);
        padding: 18px;
      }

      h1,h2,p { margin: 0; }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
        margin-bottom: 14px;
      }

      .eyebrow {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 4px;
      }

      h1 {
        font-size: 28px;
        line-height: 1;
        letter-spacing: -0.04em;
      }

      .save {
        min-height: 42px;
        padding: 0 16px;
        border: 1px solid var(--accent);
        border-radius: 14px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-size: 13px;
        font-weight: 700;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .card {
        border: 1px solid var(--border);
        border-radius: 22px;
        padding: 16px;
        background: var(--surface);
        box-shadow: 0 8px 22px rgba(15, 23, 42, 0.04);
      }

      .card-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
      }

      .card-head h2 {
        font-size: 16px;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        padding: 0 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        background: var(--surface-alt);
        color: #334155;
      }

      textarea {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--surface-alt);
        color: var(--ink);
        padding: 14px;
        font: inherit;
        font-size: 14px;
        line-height: 1.6;
        resize: none;
      }

      textarea::placeholder {
        color: #64748b;
      }

      .helper {
        display: grid;
        gap: 10px;
      }

      .helper-row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 14px;
        border-radius: 16px;
        background: var(--surface-alt);
        border: 1px solid rgba(15, 23, 42, 0.04);
      }

      .helper-row span {
        color: var(--muted);
        font-size: 12px;
      }

      .helper-row strong {
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="viewport">
      <main class="page">
        <header class="topbar">
          <div>
            <p class="eyebrow">BOSS 求职助手</p>
            <h1>规则中心</h1>
          </div>
          <button class="save">已保存</button>
        </header>

        <div class="grid">
          <section class="card">
            <div class="card-head">
              <h2>年限硬筛</h2>
              <span class="tag">规则</span>
            </div>
            <textarea rows="7" readonly>5-10年</textarea>
          </section>

          <section class="card">
            <div class="card-head">
              <h2>目标关键词</h2>
              <span class="tag">关键词</span>
            </div>
            <textarea rows="11" readonly>ToB产品
B端产品
Agent
工作流
RAG
知识库
审查
合规
风控
企业服务</textarea>
          </section>
        </div>

        <section class="card" style="margin-top:14px;">
          <div class="card-head">
            <h2>本地规则结构</h2>
            <span class="tag">storage</span>
          </div>
          <div class="helper">
            <div class="helper-row">
              <div>
                <strong>blocked / trusted</strong>
                <span>公司白黑名单</span>
              </div>
              <div>
                <strong>list</strong>
              </div>
            </div>
            <div class="helper-row">
              <div>
                <strong>batch</strong>
                <span>自动滚动, 单次上限, 去重天数</span>
              </div>
              <div>
                <strong>ready</strong>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
